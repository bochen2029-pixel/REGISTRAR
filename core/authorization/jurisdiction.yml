# REGISTRAR · L0 · the authorization jurisdiction table
# ─────────────────────────────────────────────────────────────────────────────
# WHO MAY AUTHORIZE DONATION — and why this file is mostly empty.
#
# This is the one element of the seed that cannot be established by a single
# citation. Every other locator in this repository resolves to one document.
# This one resolves to fifty-odd state statutes, each an adoption of some
# vintage of the Uniform Anatomical Gift Act, each amended locally.
#
# **ONE ROW IS FILLED. THE REST ARE YOURS.**
#
#   Texas is here because it is the author's own state — highest familiarity,
#   so a misreading is likeliest to be caught, and it makes the row contract
#   copyable instead of hypothetical.
#
#   The other forty-nine are not a backlog anyone here intends to work
#   through. They belong to the OPOs that operate under them, whose counsel
#   has already read the statute. **See PROCEDURE.md — filling your own state
#   takes about an hour, and it is the one thing this repository actively
#   wants pushed back.**
#
# CONTRIBUTED, NOT CONFIGURED
#
#   A jurisdiction row is NOT a site patch. It does not go in <site>.patch.yml
#   and it is not private to you. It goes UPSTREAM, into this file, because
#   the law is the same for everyone operating in that state.
#
#   A site does not get to DECIDE who may authorize donation. A site is
#   exactly the right party to CITE its own state's statute. Those are
#   different acts and only the second is asked for.
#
#   Note the asymmetry that makes this work: your L2/L3 fit is deliberately
#   worthless to anyone else. Your jurisdiction row is worth little to you
#   alone and a great deal to the other fifty-four — and because donation
#   service areas span state lines, **you will need rows you did not write.**
#
# WHY THIS IS THE MOST DANGEROUS FILE TO GET WRONG
#
#   Every other element here governs timing or completeness. This one governs
#   whether a recovery was lawful. A wrong row does not degrade a metric; it
#   authorises something nobody was entitled to authorise. **Nothing in this
#   file may be inferred, generalised from a neighbouring state, or filled in
#   by a model.** A row without a statute citation is not a row.
#
# WHAT BELONGS TO THE SEED AND WHAT DOES NOT
#
#   This table lives in the seed and NOT in a site patch. The variation is
#   statutory rather than operational, and **a site does not get to author who
#   may authorize donation.** An OPO may tell you its practice; practice is not
#   law here.

schema_version: 0.1
layer: L0
status: KNOWN-INCOMPLETE
generated: 2026-08-26

# ─────────────────────────────────────────────────────────────────────────────
# THE KEY — verified, and not what most people assume
# ─────────────────────────────────────────────────────────────────────────────
keyed_on: donor_state_of_residence

key_provenance:
  authority: 42 CFR 486 Subpart G
  locator: 42 CFR 486.342(b)
  accessed: 2026-08-26
  quote_verified: true
  establishes: >
    "…a potential donor consented to donation before his or her death in a
    manner that satisfied applicable State law requirements in the potential
    donor's State of residence"
  note: >
    **The governing law is the donor's state of RESIDENCE** — not the state
    where death occurred, not the state where the hospital sits, not the OPO's
    own state. Those differ routinely: donation service areas span state lines,
    and patients are transferred across them.

    A system that keyed this table on the hospital's state would be wrong in
    exactly the cases where it matters most, and would be wrong silently.

surrogate_provenance:
  authority: OPTN Policies (effective as of 2025-08-01; retrieved 2026-08-26)
  locator: OPTN Policy 2.14.E (p.36)
  accessed: 2026-08-26
  quote_verified: true
  establishes: >
    "…whether that be the donor or a surrogate donation decision-maker
    consistent with applicable state law"
  note: >
    Both the federal rule and OPTN policy DEFER on who may act as surrogate.
    Neither supplies the answer. That deference is precisely why this table
    must exist and why nothing above it can substitute for it.

# ─────────────────────────────────────────────────────────────────────────────
# THE ROW CONTRACT — what a filled row must carry
# ─────────────────────────────────────────────────────────────────────────────
row_schema:
  state:              two-letter postal code
  act:                which uniform act is in force (e.g. RUAGA 2006, UAGA 1987, UAGA 1968, or a non-uniform act)
  citation:           the state code citation, precise enough to check in under a minute
  accessed:           YYYY-MM-DD
  quote:              verbatim statutory text establishing the order of priority
  quote_verified:     true only after tools/cite.py confirms it byte-exact against a pinned source
  first_person:       whether first-person authorization is binding and not revocable by family
  surrogate_priority: the ordered class list, verbatim from the statute
  notes:              local amendments departing from the uniform text

# ─────────────────────────────────────────────────────────────────────────────
# THE TABLE
# ─────────────────────────────────────────────────────────────────────────────
jurisdictions:

  - state: TX
    name: Texas
    act: Revised Uniform Anatomical Gift Act (2006)
    adopted: Acts 2009, 81st Leg., R.S., Ch. 186 (H.B. 2027), Sec. 1, eff. September 1, 2009
    code: Texas Health and Safety Code, Chapter 692A
    source_id: tx-hs-692A
    accessed: 2026-08-26
    currency: >
      Source states it is current through the 89th 2nd Called Legislative
      Session, 2025. Recorded because a statute citation is a claim about a
      document at a date.
    acquisition: >
      **curl cannot retrieve this.** statutes.capitol.texas.gov is an Angular
      single-page app with catch-all routing: every path returns 250 KB of
      identical application shell with HTTP 200. Retrieved with a headless
      browser instead. See PROCEDURE.md — this is the failure mode most likely
      to bite a contributor, because it looks exactly like success.

    first_person:
      binding: true
      locator: § 692A.008(a)
      quote_verified: true
      quote: >
        "…in the absence of an express, contrary indication by the donor, a
        person other than the donor is barred from making, amending, or
        revoking an anatomical gift of a donor's body or part if the donor made
        an anatomical gift of the donor's body or part under Section 692A.005"
      note: >
        Family cannot override a registered donor in Texas. Note this is
        Section 692A.008 — the *preclusive effect* section — not the surrogate
        list. Numbering diverges from base RUAGA; do not assume section numbers
        transfer between states.

    surrogate_priority:
      locator: § 692A.009(a)
      quote_verified: true
      classes:
        - agent of the decedent at the time of death (per § 692A.004(2))
        - spouse of the decedent
        - adult children of the decedent
        - parents of the decedent
        - adult siblings of the decedent
        - adult grandchildren of the decedent
        - grandparents of the decedent
        - an adult who exhibited special care and concern for the decedent
        - persons acting as guardians of the person of the decedent at the time of death
        - the hospital administrator
        - any other person having the authority to dispose of the decedent's body
      note: >
        Eleven classes. Classes (10) and (11) — hospital administrator, and any
        person with authority to dispose of the body — are **not present in
        every state's list.** Do not copy this list to another state.

    within_class_rule:
      locator: § 692A.009(b)-(c)
      quote_verified: true
      quote: >
        "If an objection is known, the gift may be made only by a majority of
        the members of the class who are reasonably available."
      note: >
        A known objection inside a class escalates to a **majority of
        reasonably available members** — not unanimity, and not
        first-to-answer. And under (c) no one may act while a person in a
        *prior* class is reasonably available.

    counsel_reviewed: false
    counsel_note: >
      **Not yet reviewed by a lawyer.** Every quote above is byte-verified
      against the pinned source, which proves the text and not the reading.
      This row is a worked example that sets the shape; it must be reviewed
      before it load-bears on any real case.

# ─────────────────────────────────────────────────────────────────────────────
# HOW TO FILL IT — the honest procedure
# ─────────────────────────────────────────────────────────────────────────────
procedure:
  - step: >
      Pin a source per state. The state code itself, not a summary of it, not a
      law-firm client alert, not a secondary table. PROVENANCE.md §3: a summary
      of a rule is not the rule.
  - step: >
      Quote the statutory text verbatim and run tools/cite.py. A row whose quote
      does not byte-match its pinned source does not enter this file, no matter
      how confident anyone is that it is right.
  - step: >
      Record which act vintage is in force. States adopted different versions of
      the UAGA and amended them; assuming a uniform act is uniform is the
      characteristic error here.
  - step: >
      Have counsel review before any row load-bears. **This is the one part of
      the seed where a byte-exact citation is necessary and not sufficient** —
      a correctly quoted statute can still be misread, and the consequence of
      misreading it is not a bad metric.

scope_note: >
  1 of ~51 jurisdictions filled. This was originally written up as "large and
  left undone", which was the wrong frame: it is not one fifty-state problem,
  it is **fifty one-state problems, each with a natural owner better placed
  than this repository's author.**

  **A cited row is honest. A plausible one would be the single most dangerous
  artifact this project could ship** — and fifty plausible rows could be
  generated in ten minutes by anything that can write YAML. That is precisely
  why the gate requires a pinned source and a byte-exact quote, and why
  `counsel_reviewed` is a separate field that no automated check can set.
