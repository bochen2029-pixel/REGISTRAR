# REGISTRAR · forge · the mount contract
# ─────────────────────────────────────────────────────────────────────────────
# CAPABILITIES, NOT FILES.
#
# Each entry below is a JOB the forge needs done while completing the seed into
# one site's shape. What DOES the job is a mount, and a site may bind its own.
#
# This repository vendors none of them, for three reasons and the third is the
# one that matters:
#
#   1. A vendored copy is a fork. It drifts, it inherits its source's
#      environment coupling, and it makes this repository responsible for
#      maintaining a document splitter forever.
#   2. Licence. A plugin mounted at completion time is not redistributed here.
#      Only the interface ships.
#   3. **Your tools are as good as ours.** A site with its own document
#      pipeline should mount that. The forge declares what it needs done; it
#      does not dictate what does it — the same reason the seed does not
#      dictate the fit.
#
# THE RECURSION
#
#   Because the forge is a plugin host, a wall it hits is not a dead end. It
#   can author the plugin, shadow-run it against the site's own material, and
#   PROPOSE it — one yes mounts it hash-pinned, drift demotes, retirement
#   unwinds through the disposer. Same contract as a patch row, applied to
#   capability instead of configuration.
#
#   And it is affordable HERE in a way it is not one layer down: a forge plugin
#   that is wrong wastes an afternoon; an EDR plugin that is wrong touches a
#   case. **The forge is where recursive self-improvement is cheap enough to
#   be honest about.**

schema_version: 0.1
profile: forge
status: SPEC          # the contract is written; no binding has been mounted here

# ─────────────────────────────────────────────────────────────────────────────
# THE CONTRACT — what any binding must satisfy
# ─────────────────────────────────────────────────────────────────────────────
contract:
  declares:
    id:           the capability it binds
    version:      its own, pinned
    source:       where it came from — a path, a repo, a package
    pin:          sha256 of what was mounted. A binding without a pin is not mounted.
    entry:        the callable or command
    licence:      SPDX. **A binding with no licence cannot be mounted into an MIT tree.**

  must:
    - Take every path it reads and writes as an ARGUMENT. A binding that knows
      where things live on one machine is a binding that only works there.
    - Write only where the caller says. See the PHI rule on `chunk`.
    - Be inert when not called. No daemons, no watchers, no background work.
    - Fail loud and specific. A binding that returns empty on error will be
      believed.

  must_not:
    - Reach the network unless its capability is `fetch` or `render`, and then
      only to a caller-supplied URL.
    - Write to core/, clinical/, gates/, schema/, or any tape.
    - Persist anything derived from site material outside the caller's path.
    - Take a live audio or video lane. See `forge.yml` refused capabilities —
      this is a rule, not a per-plugin judgment.

# ─────────────────────────────────────────────────────────────────────────────
# THE CAPABILITIES
# ─────────────────────────────────────────────────────────────────────────────
capabilities:

  - id: chunk
    required: true
    need: >
      Split a document too large to read in one pass into context-sized pieces
      at clean semantic boundaries, with orientation metadata so a reader never
      loses its place. Reading the pieces in order must equal reading the whole.
    why_it_is_first: >
      This is the binding constraint of the entire completion. `elicit/method.md`
      requires PHI-bearing site material to be read ONLY by a local open-weight
      model — a small context facing a 400-page SOP binder. And the seed's own
      pinned OPTN corpus is 784 KB: the single file a harness cannot read in one
      pass while filling a locator.
    interface:
      in:  [source_path, budget_tokens, out_dir]
      out: [manifest_path, chunk_paths]
    rules:
      - id: caller_specified_output
        rule: >
          MUST write to `out_dir`. A binding that writes a `.chunks/` directory
          beside its source would silently create a second, uncontrolled copy
          of PHI-bearing material in a location nobody chose and nobody audits.
        severity: refuses_the_mount
      - id: order_is_the_document
        rule: Reading chunks in order must reconstruct the source. A lossy chunker is a different capability.
    binding:
      version: "0.1"
      source: forge/plugins/chunk/src/chunk.py
      pin: "sha256:24c706dc40864b523335112e68f474bdc8a0195aa4afc964d65b1bac5cabbfa5"
      entry: "python forge/plugins/chunk/src/chunk.py"
      licence: MIT
      provenance: forge/plugins/chunk/PROVENANCE.md
      note: >
        CLEAN-ROOM. Written from a scout's prose description of a surveyed
        tool's design; none of that tool's bytes are here, and its default
        behaviour — writing beside the source — is the reason this is a rewrite
        rather than a fold. 42 assertions, including the reconstruction
        property the surveyed tool claimed and never tested.

  - id: phi_scan
    required: true
    need: >
      Flag protected health information before it can reach a frontier route, a
      log line, a commit message, or an evidence field.
    why: >
      `AGENTS.md` §3 is currently prose, and this repository's own law 9 says a
      rule enforced only by asking people to follow it is not enforced. This is
      the gap between the two.
    interface:
      in:  [text_or_path]
      out: [findings]        # each with span, class, and confidence
    rules:
      - id: floor_not_guarantee
        rule: >
          **A HIGH-RECALL FLOOR, NEVER A GUARANTEE.** It must be specified,
          tested and described as a floor. A scanner presented as a guarantee is
          worse than no scanner, because it retires the human caution that was
          doing the actual work.
        severity: refuses_the_mount
      - id: dates_and_combinations
        rule: >
          PHI is more than names. Dates and times bound to a specific case,
          medical record numbers, donor identifiers, a hospital name bound to an
          event, and any combination that re-identifies. A single unusual case
          is re-identifiable from timing alone.
    binding:
      version: "0.1"
      source: forge/plugins/phi_scan/src/phi_scan.py
      pin: "sha256:732bb5facd20ad196c59ca95f9efdfbae758015523476099e632398bae67df08"
      entry: "python forge/plugins/phi_scan/src/phi_scan.py"
      licence: MIT
      provenance: forge/plugins/phi_scan/PROVENANCE.md
      note: >
        CLEAN-ROOM. The surveyed prior art contributed VOCABULARY and no code —
        its detection was five regexes against this domain's PHI list. Three
        verdicts and none of them is CLEAN: NONE_DETECTED says the rungs that
        RAN found nothing, and DEGRADED says a rung did not run and its silence
        carries no information. The prior art conflated those, returning zero
        spans both for a clean document and for a classifier that failed to
        load. 48 assertions.

  - id: search
    required: false
    need: Find which passage of a large pinned corpus establishes a claim.
    why: Filling a locator means locating text, not recalling it.
    interface:
      in:  [pattern, corpus_paths]
      out: [hits]            # path, offset, span
    note: >
      A site's existing search is a legitimate binding. So is grep. This is
      optional because a slow search is an inconvenience, not a failure.
    binding: null

  - id: fetch
    required: false
    need: Retrieve a public source with resume, retry, and hash verification.
    why: Pinning requires the bytes, and the bytes must be the right ones.
    interface:
      in:  [url, out_path]
      out: [path, sha256, bytes]
    rules:
      - id: validate_content
        rule: >
          **VALIDATE CONTENT, NEVER STATUS CODES.** Learned expensively: a state
          statute site returned HTTP 200 and an identical 250,874-byte
          application shell for every path tried, including nonsense ones. A
          fetch succeeded when the bytes contain what you came for.
        severity: refuses_the_mount
        see: core/authorization/PROCEDURE.md
    binding: null

  - id: render
    required: false
    need: Retrieve a source from a site that will not serve it without a browser.
    why: >
      Some primary sources are single-page applications. curl cannot see them,
      and the failure looks exactly like success.
    interface:
      in:  [url]
      out: [text]
    rules:
      - id: no_credentials
        rule: >
          A render binding carries no keys and no session. It reads public
          documents. Anything requiring authentication is a human's job.
        severity: refuses_the_mount
    binding: null

  # ───────────────────────────────────────────────────────────────────────────
  # THE THREE THE FORGE DID NOT KNOW TO DECLARE — added 2026-08-26
  #
  # The five above were chosen in advance, which is THE ENUMERATION TAX
  # APPEARING INSIDE THIS CONTRACT: you can only declare a capability you
  # already knew you wanted. Same shape as `elicit/` imposing twenty questions
  # the seed picked — work-as-imagined, at the meta level, inside the artifact
  # that names work-as-imagined as the central problem.
  #
  # Found by Fork C reading two estate organs that had already factored
  # themselves correctly and independently. See plans/PROPOSAL_read-and-reach.md.
  # ───────────────────────────────────────────────────────────────────────────

  - id: read
    required: false          # NOT required — see the note
    need: >
      Induce a schema from a corpus too large for any reader, and freeze it
      under an operator-ratified charter. Not a summary — a STRUCTURE, with
      every claim span-checked against a lossless tape by deterministic code.
    why: >
      `elicit/` asks twenty questions the SEED chose. **A site whose operation
      differs in a way the seed never imagined is exactly the site the seed
      fails.** This is the capability that finds an UNDECLARED variation point.
    beats: >
      the twenty declared questions — which it does not replace. See below.
    binding: null
    rules:
      - id: induced_not_imposed
        rule: >
          The schema comes from the corpus and is ratified by a human. A
          taxonomy applied to a corpus is a different capability.
        severity: refuses_the_mount
      - id: local_leg_only
        rule: >
          **Site material may not rent a reading.** PHI-bearing corpora are read
          by the local leg or not at all — AGENTS.md §3. Both candidate organs
          currently rent a frontier API, which is why this is declared and
          unbound rather than bound today.
        severity: refuses_the_mount
      - id: proposes_upstream_never_patches
        rule: >
          **AN INDUCED VARIATION POINT IS A PROPOSAL TO THE SEED, NOT A PATCH
          ROW.** It goes upstream, human-ratified, and becomes L0/L1 for all
          fifty-five. A site still cannot patch an undeclared target — it can
          DISCOVER that one is missing.

          Without this rule the capability breaks T4: the seed's fixed variation
          list is what bounds the blast radius, and that bound is what makes the
          reachable set independent of the agent. A site inducing its own
          targets and patching them has no bound at all.
        severity: refuses_the_mount
    note: >
      **NOT `required: true`, deliberately.** Required means the forge cannot
      proceed without it, which is true of `chunk` and `phi_scan` and is not
      true of this. Marking it required would leave every forge instance
      permanently PASS-UNVERIFIED on a capability nobody can bind — a claim of
      brokenness rather than of ambition.

      **And induction does not subsume declaration.** An induced schema reflects
      what the corpus CONTAINS, and a corpus reflects what the organisation
      RECORDS. A site that never records after-hours ownership has no
      after-hours ownership in its induced schema — while the seed's a-priori
      question still ASKS, and a human answers from memory. **Induction inherits
      the blind spots of the recording practice, which is work-as-imagined
      wearing a different coat.** The twenty questions catch a class induction
      structurally cannot. They are complementary; neither dominates.

  - id: reach
    required: false
    need: >
      Complete addressability over a corpus larger than the window, with every
      answer carrying its own precision bound — how much was touched, how well,
      from how many independent sources, and WHAT COULD NOT BE SEEN.
    why: >
      *An unmarked bridge is a liability; a load-rated one is infrastructure.*
    beats: chunk
    binding: null
    rules:
      - id: load_rated
        rule: >
          An answer without its coverage, fidelity and corroboration is not an
          answer.
        severity: refuses_the_mount
      - id: never_interchange_the_quantities
        rule: >
          Addressability is not coverage and is never printed as one. The same
          law as three-states-never-two, at the measurement layer.
        severity: refuses_the_mount
      - id: beats_its_null
        rule: >
          **Must beat `chunk` on the site's own material, measured.** Chunking
          is what you do when you have no index; a retrieval organ that does not
          beat *split it and read the pieces* is theatre. No organ outlives its
          null.
    note: >
      **`beats: chunk`, not `null: chunk`.** The proposal that raised this
      capability wrote `null: chunk` — and `null:` is a YAML reserved word that
      parses as the None KEY, so the field would have vanished silently. The
      same trap the lab adapter hit, and the adapter checker now refuses it.
      **A proposal for a gate, caught by a gate.**

# ─────────────────────────────────────────────────────────────────────────────
# NOT MOUNTABLE — named here because the set must be complete, and refused here
# because it is not the kind of thing a site substitutes
# ─────────────────────────────────────────────────────────────────────────────
#
# `attest` was raised as a sixth CAPABILITY and built as one. The forge's own
# conformance checker refused it, and the refusal was right: every bound
# capability must live under `forge/plugins/<id>/` with its own LICENSE and
# PROVENANCE, because a capability is something a SITE MAY BIND ITS OWN VERSION
# OF — the forge declares what it needs done and does not dictate what does it.
#
# **A gate is the opposite kind of object.** It is something the forge must
# REFUSE with, and refusal is not substitutable: a fence a site can swap is not
# a fence. Listing it among the capabilities invited exactly the substitution
# that must not happen.
#
# So it is named here and lives in `gates/`, immutable to a completing harness
# like every other gate. **The capability the proposal identified was real; the
# category was wrong, and the checker caught the category error.**
not_mountable:
  - id: attest
    is: gate 16 — gates/attest.py
    need: >
      Decide whether a claim, read AS PROSE, supports the value it is offered
      for — deterministically, never by a model.
    why: >
      cite.py checks a QUOTE byte-exact. divergence checks the NUMBERS. Neither
      reads the evidence as prose, so a superseded rule offered for a current
      value passed silently. Measured 2026-08-26 with three probes, then built.
    why_not_mountable: >
      A site binding its own version of a refusal is a site removing the
      refusal. Compare `chunk`: if your document splitter is better than ours,
      mount it — the forge only needs the job done. There is no equivalent
      sentence for a fence.
    witnessed_by: examples/worked/rejected/23-superseded-evidence.json
    bounded: >
      It does not have the site's material and says so on every GREEN. It checks
      the claim against itself and against the row — never against the source.
      A human still reads the locator.

# ─────────────────────────────────────────────────────────────────────────────
# PROPOSED — capabilities the forge itself asked for
# ─────────────────────────────────────────────────────────────────────────────
# INSTRUMENT, in FUSOR's vocabulary: where surprise persists. When the forge
# hits a wall it cannot pass, the request lands here, shadow-run and awaiting a
# signature — the same path as a patch row, because it is the same contract.
proposed: []
