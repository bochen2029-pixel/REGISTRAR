    expiry: "2027-03-01"
    author: ""
    $note: "Recorded at exactly the level the question sheet allows: WHICH protocol is in use and WHO may deviate. No clinical target or threshold is encoded - those are L1. Per elicit/questions.yml this row must be read by a clinician before any signature."

  - id: "fb-013"
