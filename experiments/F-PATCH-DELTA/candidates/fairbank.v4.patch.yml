      would_have_missed: 38
      notes: "Replay of the predominant location against the extract. The tape records WHERE a workup ran but not WHICH ROLE performed it, so the role half of this variation point is unanswered by this material - the location half is encoded, the role half is left open rather than inferred from the rota."
    expiry: "2027-03-01"
    author: ""

