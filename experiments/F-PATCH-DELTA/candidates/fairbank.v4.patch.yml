# fairbank.v4.patch.yml - candidate site patch for the FICTIONAL Fairbank Donor Network
# Machine-authored DRAFT. Every author field is empty on purpose: a machine's output is a
# candidate, and a named human signs before anything mounts.
#
# Method: every figure below is COMPUTED from the raw event extracts in site_v4/tape/
# (nearest-rank percentiles: sorted values, index ceil(p/100 * n)); documents are cited as
# the binder. Where binder and tape disagree, the observed practice is encoded and both are
# cited; where they disagree without a clean majority, the target is held, not smoothed.
# The tape carries no calendar dates, so no shadow_run declares a window - the extracts are
# undated and inventing a period would be fabrication.

schema_version: "0.1"

site:
  id: "fairbank"
  name: "Fairbank Donor Network (FICTIONAL - F-PATCH-DELTA site_v4 completion exercise)"

rows:

  # -- tier 1 - the constraints that bind schedules ---------------------------

  - id: "fb-001"
    target: recovery.or_availability
    layer: "L2"
    value:
      hospitals:
        - hospital: "H-1102"
          opens: "07:00"
          closes: "17:00"
        - hospital: "H-1207"
          opens: "19:00"
          closes: "23:00"
        - hospital: "H-1355"
          opens: "08:00"
          closes: "17:00"
    inverse: null
    derived_from: "window per hospital is the hull of observed cross-clamp times on the recovery extract, rounded outward to the whole hour (observed min-max: H-1102 07:00-16:50, H-1207 19:10-22:45, H-1355 08:45-17:00)"
    evidence:
      - kind: config
        source: "interfaces/inventory.md, H-1207 row"
        says: "H-1207 is annotated 'evening OR block'"
      - kind: tape
        source: "tape/recovery.csv, cross_clamp_hour/minute grouped by hospital"
        says: "all 32 H-1102 cross-clamps fell 07:00-16:50; all 13 H-1207 cross-clamps fell 19:10-22:45; all 12 H-1355 cross-clamps fell 08:45-17:00"
    shadow_run:
      cases: 57
      would_have_matched: 57
      would_have_missed: 0
      notes: "59 recoveries on the extract; the two at H-1490 (10:30 and 13:15) are excluded because this row states no window for that hospital - two cases are too thin to claim one."
    expiry: "2027-03-01"
    author: ""
    $note: "The H-1207 evening block is written down nowhere but one inventory annotation, and on H-1207 cases it is the constraint the whole schedule is computed backwards from. H-1490 is deliberately absent from this row: whoever books that room knows the answer, and the tape (two cases) does not."

  - id: "fb-002"
    target: intake.timely_referral_definition
    layer: "L3"
    value:
      agreements:
        - hospital: "H-1102"
          notification_minutes: 60
        - hospital: "H-1355"
          notification_minutes: 90
    inverse: null
    evidence:
      - kind: document
        source: "contracts/agreements/H-1102.md section 4"
        says: "notification to the Network within sixty (60) minutes of a patient meeting clinical triggers"
      - kind: document
        source: "contracts/agreements/H-1355.md section 4"
        says: "notification within ninety (90) minutes of a patient meeting clinical triggers"
      - kind: document
        source: "ops/SOP-03-referral-intake.md"
        says: "timely referral is defined per participating-hospital agreement - see contracts/agreements/"
    shadow_run:
      cases: 400
      would_have_matched: 261
      would_have_missed: 139
      notes: "Coverage replay over the referral extract: 182 (H-1102) + 79 (H-1355) referrals arrived from hospitals whose agreements are in the corpus; 105 (H-1207) + 34 (H-1490) arrived from hospitals whose agreements are absent, and this row states nothing for them."
    expiry: "2027-03-01"
    author: ""
    $note: "THE AGREEMENTS FOR H-1207 AND H-1490 ARE NOT IN THE CORPUS - contracts/agreements/ holds two of four. The definitions that ARE present differ per hospital (60 vs 90), which is the shape the CFR expects, so that difference is not a contradiction. But nothing here bounds H-1207, the second-highest-volume hospital on the extract, and no figure is filled in for it: the term is defined by the agreement, so the two missing documents need the relationship owner, not a plausible number. The replay prints the uncovered traffic - 139 of 400 referrals."

  - id: "fb-003"
    target: evaluation.reference_lab
    layer: "L3"
    value:
      lab: "fairbank-reference"
      panel: "standard-serology"
      turnaround_minutes_p75: 234
      turnaround_minutes_p90: 284
    inverse: null
    derived_from: "nearest-rank p75 and p90 of minutes_drawn_to_resulted over all 149 panels on the workup extract"
    evidence:
      - kind: document
        source: "contracts/reference-lab-2026.md"
        says: "standard serology panel reported within four (4) hours (240 minutes) of receipt, 24/7; the laboratory's own QA cites a p75 of ~234 minutes on 149 panels, within contract"
      - kind: tape
        source: "tape/workup.csv, minutes_drawn_to_resulted, n=149"
        says: "computed p75 is 234 minutes and p90 is 284 minutes; 117 of 149 panels resulted within the contracted 240 minutes and 32 breached it"
    shadow_run:
      cases: 149
      would_have_matched: 136
      would_have_missed: 13
      notes: "Replay of the p90 budget: 136 of 149 panels resulted within 284 minutes. A deadline computed on the contract's 240 would have been optimistic on 32 of 149 cases - wrong in the direction that loses organs."
    expiry: "2026-12-01"
    author: ""
    $note: "The binder's QA line is true and misleading at once: the tape reproduces the lab's p75 of 234 exactly (within contract), and one panel in five still breaches the 240-minute figure the match run waits on. Serology gates everything downstream, so downstream deadlines should budget the p90, not the contract."

  - id: "fb-004"
    target: recovery.team_mobilisation
    layer: "L3"
    value:
      in_house_or_scheduled_to_incision_minutes: 105
      contracted_or_scheduled_to_incision_minutes: 145
    inverse: null
    derived_from: "p75 of OR-scheduled to incision by team, rounded up to the next 5 minutes: in-house p75 104 -> 105, contracted p75 144 -> 145"
    evidence:
      - kind: tape
        source: "tape/recovery.csv, minutes_or_scheduled_to_incision by team"
        says: "over 50 in-house recoveries the p75 was 104 minutes (p90 117, max 154); over the nine contracted recoveries the p75 was 144 minutes (max 154)"
      - kind: config
        source: "rota/call-schedule.md"
        says: "recovery teams in-house, contracted overflow only"
    shadow_run:
      cases: 59
      would_have_matched: 48
      would_have_missed: 11
      notes: "40 of 50 in-house recoveries came inside 105 minutes and 8 of 9 contracted inside 145. A p75-based lead time is exceeded about a quarter of the time by construction; the counts are printed rather than hidden so the next review can argue with them."
    expiry: "2027-03-01"
    author: ""
    $note: "One number for both teams would be the number for the easier team - the contracted overflow runs 40 minutes slower at p75. The contracted figure rests on nine cases and is thin; it should be re-derived as soon as more contracted recoveries exist."

  - id: "fb-005"
    target: allocation.offer_window_practice
    layer: "L2"
    value:
      budget_minutes: 240
    inverse: null
    derived_from: "p90 of the observed distribution (237 minutes), rounded up to 240; the figure feeds a latest-safe-start computation, which must assume the worst case or it is not a guarantee"
    evidence:
      - kind: tape
        source: "tape/allocation.csv, minutes_matchrun_to_primary_acceptance, n=94"
        says: "computed p90 of match run to primary acceptance was 237 minutes (median 147, p75 176, max 335)"
    shadow_run:
      cases: 94
      would_have_matched: 86
      would_have_missed: 8
      notes: "86 of 94 acceptances arrived inside the 240-minute budget. Budgeted at p90 rather than p75 because this number decides how early the match run must happen to hold an OR slot."
    expiry: "2027-03-01"
    author: ""

  - id: "fb-006"
    target: transport.providers
    layer: "L3"
    value:
      providers:
        - provider: "meridian_medical_courier"
          mode: "ground"
          response_minutes_p90: 43
          door_to_door_minutes_p90: 279
        - provider: "northline_air_charter"
          mode: "fixed_wing"
          response_minutes_p90: 44
          door_to_door_minutes_p90: 260
    inverse: null
    derived_from: "nearest-rank p90 of response_minutes and door_to_door_minutes per provider over the dispatch extract"
    evidence:
      - kind: document
        source: "contracts/transport-2026.md"
        says: "ground is Meridian Medical Courier at a contracted response-to-pickup of 45 minutes, 24/7; fixed wing is Northline Air Charter, wheels-up 90 minutes; no standing rotor; commercial carriage is tissue only"
      - kind: tape
        source: "tape/dispatch.csv, per provider"
        says: "over 92 courier movements the response p90 was 43 minutes (six movements exceeded the contracted 45) and door-to-door p90 was 279 minutes; over 32 air movements the response p90 was 44 and door-to-door p90 was 260 minutes"
    shadow_run:
      cases: 124
      would_have_matched: 112
      would_have_missed: 12
      notes: "112 of 124 movements closed door-to-door inside their provider's stated p90 (83 of 92 ground, 29 of 32 air). The extract carries no destination field, so door-to-door is per movement, not per accepting centre."
    expiry: "2026-12-01"
    author: ""
    $note: "The contracts state response-to-pickup and wheels-up only. Door-to-door - the figure that actually consumes ischemia budget - appears in no document and is computed here from the dispatch extract for the first time. Per-centre figures, which the question sheet asks for, need a destination field the extract does not carry."

  # -- tier 2 - whether a case is caught in time ------------------------------

  - id: "fb-007"
    target: intake.after_hours_owner
    layer: "L2"
    value: "house_coordinator"
    inverse: null
    evidence:
      - kind: document
        source: "ops/SOP-03-referral-intake.md rev 7"
        says: "after-hours referrals route to the House Coordinator"
      - kind: tape
        source: "tape/referrals.csv, after_hours=1, worked_by"
        says: "202 of 215 after-hours referrals were worked by the house coordinator; the other 13 by the on-call supervisor"
      - kind: config
        source: "rota/call-schedule.md"
        says: "House Coordinator 19:00-07:00 on site; On-call Supervisor 24/7 remote"
    shadow_run:
      cases: 215
      would_have_matched: 202
      would_have_missed: 13
      notes: "Business-hours referrals (185 of 185 worked by clinical coordinators) are outside this row's scope; the after_hours flag on the extract agrees with the SOP's 07:00-19:00 definition on all 400 referrals."
    expiry: "2027-03-01"
    author: ""
    $note: "Binder and behaviour AGREE here: rev 7 of the SOP names the house coordinator and the tape confirms it in 202 of 215 cases. Encoded from the tape, with the SOP cited alongside."

  - id: "fb-008"
    target: triage.callback_practice
    layer: "L2"
    value:
      callback_within_minutes: 20
    inverse: null
    evidence:
      - kind: document
        source: "ops/SOP-03-referral-intake.md"
        says: "where first contact does not reach a decision-maker, a second attempt is made within thirty (30) minutes"
      - kind: tape
        source: "tape/referrals.csv, first_contact_no_answer=1, n=117"
        says: "computed p75 of minutes to second contact was 20 (median 15, p90 25, max 49); 115 of 117 second attempts came inside the SOP's 30 minutes"
    shadow_run:
      cases: 117
      would_have_matched: 88
      would_have_missed: 29
      notes: "88 of 117 second contacts came inside 20 minutes. The threshold is set at the observed p75, not the SOP's 30: practice runs well inside the written bound, and a threshold set where practice actually runs surfaces drift instead of absorbing it."
    expiry: "2027-03-01"
    author: ""

  - id: "fb-009"
    target: lapse.threshold
    layer: "L2"
    value:
      minutes_without_progression: 90
    inverse: null
    derived_from: "largest round threshold at or below the p25 (92 minutes) of stall-before-closure over never-progressed referrals, so that at least three quarters are surfaced while still open: 90 catches 194 of 251 where the SOP's 120 catches 115"
    evidence:
      - kind: document
        source: "ops/SOP-03-referral-intake.md"
        says: "a referral with no progression for two hours (120 minutes) is reviewed at handover"
      - kind: tape
        source: "tape/referrals.csv, progressed=0, minutes_stalled_before_closed"
        says: "of 251 never-progressed referrals, 194 had already sat 90 minutes or more without progression before closure and only 115 had sat 120 or more; computed p25 of stall-before-closure was 92 minutes (median 115, p75 144)"
    shadow_run:
      cases: 251
      would_have_matched: 194
      would_have_missed: 57
      notes: "A 90-minute threshold would have fired before closure on 194 of 251 eventually-lost referrals; the SOP's 120-minute handover review reaches 115. Progressed referrals carry no stall minutes on this extract, so the false-fire rate on converting referrals is not computable from this material and should be watched after mount."
    expiry: "2026-12-01"
    author: ""
    $note: "The binder's 120 is a handover review point, not a lapse alarm; no material sets an explicit lapse threshold, so this one is DERIVED from the tape per the seed's own question sheet. Direction of safety runs opposite to most timing rows: a LONGER threshold surfaces FEWER stalled referrals, so 90 against the SOP's 120 is the conservative side."

