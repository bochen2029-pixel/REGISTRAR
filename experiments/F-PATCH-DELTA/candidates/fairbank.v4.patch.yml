holds:

  - target: triage.ruleout_authority
    tier: 2
    class: sources_contradict
    reason: "The SOP reserves judgment ruleouts to the physician at all hours; overnight, the tape shows the house coordinator making a third of them."
    searched: "ops/SOP-11-triage.md; tape/ruleouts.csv (basis by decided_by by hour, all 99 ruleouts); rota/call-schedule.md"
    detail: "SOP-11 rev 4 allows a Clinical Services Coordinator to rule out on Appendix A criteria 1-9 and requires the physician on call for any clinical-judgment ruleout, explicitly at all hours. The tape agrees on the first half: all 69 Appendix A ruleouts were coordinator-decided and every criterion cited is within 1-9. It contradicts the second: of 30 clinical-judgment ruleouts, 20 were decided by the physician on call and 10 by the house coordinator - and all 10 house-coordinator decisions fall after hours. Of the 17 after-hours judgment ruleouts, 10 went to the house coordinator and 7 to the physician: no clean majority to encode under the method's own rule. A ruleout is terminal, and the rota claims 24/7 physician coverage, so either the rota overstates coverage or practice has quietly delegated a terminal decision overnight. That reconciliation belongs to the medical director, not to a completion - surfaced here rather than encoded either way."

  - target: management.escalation_ladder
    tier: 2
    class: sources_contradict
    reason: "The written five-level ladder and its 20-minute rung timer describe neither who actually responds first nor how fast anything is acknowledged."
    searched: "ops/SOP-24-escalation.md; tape/escalations.csv (raised_by by first_responder by hour, ack_minutes, all 140 threads); rota/call-schedule.md"
    detail: "SOP-24 rev 3 writes the ladder as Clinical Coordinator, House Coordinator, On-call Supervisor, Director of Clinical Operations, Medical Director, with escalation after twenty unacknowledged minutes. On the tape, all 140 threads were raised by clinical coordinators; the first responder was the Director in 79, the supervisor in 43 and the house coordinator in 18. After hours the ladder inverts outright: 79 of 91 threads were first answered by the Director - three rungs up - against 12 by the supervisor; business-hours threads split 31 supervisor to 18 house coordinator, with no clean majority. Observed acknowledgement p75 is 41 minutes with a minimum of 17, and 133 of 140 threads exceeded the written 20-minute rung timer, so the timer as written describes almost nothing that happened. The rota's own annotation - supervisor 24/7 remote, 'frequently engaged' - may explain the skip, but whether coordinator-straight-to-Director is intended practice or a nightly failure of the middle rungs needs someone who works those shifts. Encoding either reading would resolve by fiat a conflict the organisation has not resolved."

  - target: transport.perfusion
    tier: 3
    class: no_evidence
    reason: "No perfusion arrangement appears anywhere in the material."
    searched: "contracts/transport-2026.md; tape/dispatch.csv (providers and modes over all 124 movements); interfaces/inventory.md; ops/; the README coverage note"
    detail: "The transport agreement covers ground courier, fixed wing and commercial tissue carriage only; the dispatch extract's providers are Meridian and Northline with no perfusion movement recorded; no contract, machine inventory or SOP mentions perfusion anywhere in the corpus. Either the Network does not use machine perfusion or the arrangement lives outside this material. Nothing to encode, and no figure invented in its place."

$comment: "Seventeen rows and three holds account for all twenty declared targets. The two sources_contradict holds are findings about the organisation, not gaps in the work: a terminal decision delegated overnight against the SOP, and an escalation ladder whose middle rungs the tape shows being skipped. Both need a human who owns those shifts. Every figure was computed from tape/ (the raw events) rather than quoted from a document summary; the one place the binder's summary could be checked against the tape - the reference lab's claimed p75 of 234 over 149 panels - it reproduced exactly, and its 'within contract' framing still hides a one-in-five breach rate at the contracted 240."
